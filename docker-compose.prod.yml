# Production Docker Compose — for use with Portainer (or plain `docker compose`).
#
# Uses pre-built images from GHCR rather than building locally.
# Images are built and pushed automatically by the GitHub Actions deploy workflow
# (.github/workflows/deploy.yml) on every push to main.
#
# Architecture:
#   nginx  — front door. Serves the built React SPA at / and reverse-proxies
#            /api, /accounts, admin, /static, feeds and /media to `web`.
#            This is the ONLY service the host reverse proxy talks to.
#   web    — Django/gunicorn (API, admin, auth, feeds). Internal only.
#   celery / celery-beat — background workers.
#   db / redis — Postgres+PostGIS and Redis. Internal only.
#
# Required environment variables (set in Portainer stack env or .env file):
#   SECRET_KEY, DATABASE_URL, CELERY_BROKER_URL, CELERY_RESULT_BACKEND,
#   UPLOAD_API_TOKEN, ALLOWED_HOSTS, CSRF_TRUSTED_ORIGINS, DB_PASSWORD
#   (see .env.example for the full list)
#
# Optional but recommended in production: MAILGUN_API_KEY, MAILGUN_SENDER_DOMAIN,
# DEFAULT_FROM_EMAIL — without these, account-creation notification emails
# (sadie/auth_views.py's create_account endpoint) fall back to Django's console
# backend and are only written to the `web` container's stdout, never actually
# delivered.
#
# Reverse proxy (Nginx Proxy Manager on the Unraid host):
#   Point your proxy host at http://<host>:${WEB_PORT:-8000} (the nginx service).
#   NPM terminates TLS and forwards X-Forwarded-Proto, which nginx passes to
#   Django so HTTPS/CSRF are detected correctly.
#
# Portainer setup:
#   1. Stacks → Add Stack → paste this file (or point to the Git repo).
#   2. Add environment variables in the Portainer UI.
#   3. Deploy the stack, then go to Webhooks and copy the redeploy URL.
#   4. Add the URL as PORTAINER_WEBHOOK_URL in GitHub repo secrets.
#      The deploy workflow will call it automatically after each build.
#   NOTE: the redeploy webhook only re-pulls images. When THIS compose file
#   changes (e.g. adding the nginx service), you must update the stack itself
#   in Portainer (Pull-and-redeploy for a Git stack, or re-paste the editor).

x-app-image:   &app-image   ghcr.io/thisisthechris/sadie:latest
x-nginx-image: &nginx-image ghcr.io/thisisthechris/sadie-nginx:latest
x-db-image:    &db-image    ghcr.io/thisisthechris/sadie-db:latest

services:

  db:
    image: *db-image
    environment:
      POSTGRES_DB: ${DB_NAME:-sadie}
      POSTGRES_USER: ${DB_USER:-sadie}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sadie}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # db port is intentionally NOT exposed externally

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # redis port is intentionally NOT exposed externally

  web:
    image: *app-image
    # Run migrations and collectstatic at startup. staticfiles is the container's
    # ephemeral layer (no volume) so Django's collected static always matches the
    # image. web is internal-only now — nginx is the public entrypoint.
    #
    # SEED_DEMO_DATA=true (set in .env) runs the one-shot test-data simulation
    # (organisations/management/commands/simulate_test_data.py) on every
    # deploy — venues, demo user, and a cumulative top-up of synthetic events/
    # interactions/postcodes. Uses `;` (not `&&`) so a failure there can never
    # stop gunicorn from starting. ONLY set this flag on a test/staging stack's
    # .env — never on a real production database.
    command: sh -c "python manage.py migrate --noinput && echo '[COLLECTSTATIC] Starting...' && python manage.py collectstatic --noinput --clear --verbosity=2 && echo '[COLLECTSTATIC] Complete!' ; if [ \"$$SEED_DEMO_DATA\" = \"true\" ]; then echo '[SEED_DEMO_DATA] Running simulate_test_data...' && python manage.py simulate_test_data ; fi ; gunicorn sadie.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120 --access-logfile -"
    volumes:
      - media_volume:/app/mediafiles
      - embeddings_cache:/root/.cache/fastembed
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # No host port and no `public` network: only nginx (same default network)
    # reaches web at http://web:8000.

  nginx:
    image: *nginx-image
    # Serves the built SPA and reverse-proxies the dynamic routes to web:8000.
    ports:
      - "${WEB_PORT:-8000}:80"
    volumes:
      # Serve user-uploaded media directly from the shared volume (read-only).
      - media_volume:/media:ro
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - default
      - public

  celery:
    image: *app-image
    command: celery -A sadie worker --loglevel=info --concurrency 2
    volumes:
      - embeddings_cache:/root/.cache/fastembed
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    image: *app-image
    command: >
      celery -A sadie beat
        --loglevel=info
        --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  media_volume:
  embeddings_cache:

networks:
  public:
    external: true  # Unraid host network (or any existing shared network)
