# Development overrides – auto-loaded by `docker compose up`.
# Swaps gunicorn for Django's runserver (auto-reload on code changes)
# and runs Celery via watchdog so tasks reload too.

services:
  web:
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_DEBUG: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    stdin_open: true
    tty: true

  celery:
    command: >
      sh -c "pip install --quiet watchdog &&
             watchmedo auto-restart --directory=/app --pattern='*.py' --recursive --
             celery -A sadie worker --loglevel=info"

  celery-beat:
    command: >
      sh -c "pip install --quiet watchdog &&
             watchmedo auto-restart --directory=/app --pattern='*.py' --recursive --
             celery -A sadie beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler"

  # Builds the Vite SPA into ./frontend/dist on the host. Because the web
  # container bind-mounts the repo at /app, that dist folder shows up at
  # /app/frontend/dist where Django serves it under /app/* and /static/spa/.
  # `vite build --watch` rebuilds on source changes; refresh the browser.
  frontend:
    image: node:20-alpine
    working_dir: /frontend
    volumes:
      - ./frontend:/frontend
      - frontend_node_modules:/frontend/node_modules
    command: >
      sh -c "npm install --no-audit --no-fund &&
             npm run build -- --watch"

volumes:
  frontend_node_modules:
