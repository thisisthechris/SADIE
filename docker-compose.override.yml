# Development overrides – auto-loaded by `docker compose up`.
# Swaps gunicorn for Django's runserver (auto-reload on code changes)
# and runs Celery via watchdog so tasks reload too.

services:
  web:
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      CSRF_TRUSTED_ORIGINS: "http://localhost:5173,http://localhost:8000"
    stdin_open: true
    tty: true

  celery:
    command: >
      sh -c "pip install --quiet watchdog &&
             watchmedo auto-restart --directory=/app --pattern='*.py' --recursive --
             celery -A sadie worker --loglevel=info"

  celery-beat:
    command: >
      sh -c "pip install --quiet watchdog &&
             watchmedo auto-restart --directory=/app --pattern='*.py' --recursive --
             celery -A sadie beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler"

  # Runs the Vite HMR dev server at http://localhost:5173.
  # Proxies /api, /accounts, /media to the Django container (web:8000).
  # Browse to http://localhost:5173 for hot-reload during development.
  frontend:
    image: node:20-alpine
    working_dir: /frontend
    volumes:
      - ./frontend:/frontend
      - frontend_node_modules:/frontend/node_modules
    environment:
      BACKEND_URL: "http://web:8000"
    command: >
      sh -c "npm install --no-audit --no-fund &&
             npm run dev -- --host"
    ports:
      - "5173:5173"
    depends_on:
      - web

volumes:
  frontend_node_modules:
