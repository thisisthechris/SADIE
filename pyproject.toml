[tool.ruff]
line-length = 119
target-version = "py311"
exclude = [
    "*/migrations/*",
    ".git",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Settings files use wildcard imports intentionally
"sadie/settings*.py" = ["F401", "F403", "F405"]
