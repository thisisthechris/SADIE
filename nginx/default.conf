# SADIE front-door nginx config.
#
# Serves the built React SPA at the site root and reverse-proxies the dynamic
# parts of the app (API, admin, auth, feeds, Django static, media) to the
# gunicorn container (`web`). The host's Nginx Proxy Manager terminates TLS and
# forwards to this container; we honour its X-Forwarded-Proto so Django detects
# HTTPS correctly.

# Normalise the forwarded protocol: prefer the value NPM sends, fall back to the
# scheme of the request when accessed directly (e.g. local testing).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    # Docker's embedded DNS. Resolving the `web` upstream at request time (via a
    # variable in proxy_pass) means nginx still boots if web is briefly
    # unresolvable, and it picks up web's new IP if that container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $web "web:8000";

    # Allow reasonably large uploads (CSV imports, images) through to Django.
    client_max_body_size 25m;

    # Forward the original request context to the backend so Django builds
    # correct absolute URLs, detects HTTPS, and validates CSRF/Host.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_http_version 1.1;

    # ── Legacy /app/* links ─────────────────────────────────────────────────
    # The SPA used to be mounted under /app; redirect old shared links to the
    # equivalent path at the root (e.g. /app/insights/map -> /insights/map).
    location = /app {
        return 301 /;
    }
    location ^~ /app/ {
        rewrite ^/app/(.*)$ /$1 permanent;
    }

    # ── Dynamic backend (Django / gunicorn) ─────────────────────────────────
    location /api/            { proxy_pass http://$web$request_uri; }
    location /accounts/       { proxy_pass http://$web$request_uri; }
    location /herebedragons/  { proxy_pass http://$web$request_uri; }
    # Django-collected static (admin, DRF browsable API, leaflet widgets).
    location /static/         { proxy_pass http://$web$request_uri; }

    # Public feeds and saved-view short links served by Django.
    location = /calendar.ics  { proxy_pass http://$web$request_uri; }
    location /calendar/       { proxy_pass http://$web$request_uri; }
    location = /events.json   { proxy_pass http://$web$request_uri; }
    location = /events.rss    { proxy_pass http://$web$request_uri; }
    location /rss/            { proxy_pass http://$web$request_uri; }
    location /v/              { proxy_pass http://$web$request_uri; }

    # ── User-uploaded media ─────────────────────────────────────────────────
    # Served directly from the shared volume (mounted read-only) — Django does
    # not serve media in production.
    location /media/ {
        alias /media/;
        access_log off;
        expires 7d;
    }

    # ── SPA static assets ───────────────────────────────────────────────────
    # Vite emits content-hashed files under /assets/, safe to cache forever.
    location /assets/ {
        root /usr/share/nginx/html;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA shell ───────────────────────────────────────────────────────────
    # Everything else falls back to index.html so client-side routing works.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        # The HTML shell must never be cached so new asset hashes are picked up.
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
