name: Build & Deploy

# Builds both Docker images, pushes them to GHCR, then triggers a Portainer
# webhook to pull the new images and redeploy the production stack.
#
# No registry credentials are required — GITHUB_TOKEN is used for GHCR.
# The only secret you need to add is:
#   PORTAINER_WEBHOOK_URL — Portainer → Stack → Webhooks → copy URL
#   (the deploy step is silently skipped if the secret is not set)

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write  # required to push to GHCR

jobs:
  build:
    name: Build & push images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── App image (web / celery / celery-beat) ──────────────────────────────
      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/thisisthechris/sadie:latest
            ghcr.io/thisisthechris/sadie:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── nginx front-door image (serves the SPA + proxies to web) ─────────────
      - name: Build and push nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: nginx/Dockerfile
          push: true
          tags: |
            ghcr.io/thisisthechris/sadie-nginx:latest
            ghcr.io/thisisthechris/sadie-nginx:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── DB image (PostGIS + pgvector) ────────────────────────────────────────
      - name: Build and push db image
        uses: docker/build-push-action@v6
        with:
          context: ./db
          push: true
          tags: |
            ghcr.io/thisisthechris/sadie-db:latest
            ghcr.io/thisisthechris/sadie-db:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Trigger Portainer redeploy
    runs-on: ubuntu-latest
    needs: build
    env:
      PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}

    steps:
      - name: Redeploy stack via webhook
        if: env.PORTAINER_WEBHOOK_URL != ''
        run: |
          curl -sS -f -X POST "$PORTAINER_WEBHOOK_URL"
          echo "Portainer redeploy triggered."
