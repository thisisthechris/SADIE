version: "3.9"

services:
  db:
    # Postgres 15 + PostGIS 3.3 + pgvector + pg_trgm/unaccent.
    build: ./db
    image: sadie-db:pg15-postgis33-pgvector
    environment:
      POSTGRES_DB: sadie
      POSTGRES_USER: sadie
      POSTGRES_PASSWORD: sadie_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sadie"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate &&
             gunicorn sadie.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
      - embeddings_cache:/root/.cache/fastembed
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build: .
    command: celery -A sadie worker --loglevel=info
    volumes:
      - .:/app
      - embeddings_cache:/root/.cache/fastembed
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build: .
    command: celery -A sadie beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /frontend
    # Install deps on startup (uses cached volume) then start the Vite dev server.
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    volumes:
      - ./frontend:/frontend
      # Separate volume keeps container node_modules isolated from host binaries.
      - frontend_node_modules:/frontend/node_modules
    ports:
      - "5173:5173"
    environment:
      # Vite proxies /api /accounts /media to this URL inside the compose network.
      BACKEND_URL: "http://web:8000"
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
  media_volume:
  embeddings_cache:
  frontend_node_modules:
