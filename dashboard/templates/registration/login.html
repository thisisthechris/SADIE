{% extends "base.html" %}

{% block title %}Log in – SADIE{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-4 col-sm-8">
    <div class="card shadow-sm mt-5">
      <div class="card-body p-4">
        <h4 class="card-title mb-4 text-center"><i class="bi bi-lock"></i> Log in</h4>
        {% if form.errors %}
          <div class="alert alert-danger">
            Your username and password didn't match. Please try again.
          </div>
        {% endif %}
        <form method="post">
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ next }}">
          <div class="mb-3">
            <label for="id_username" class="form-label">Username</label>
            <input type="text" name="username" id="id_username" class="form-control" autofocus required>
          </div>
          <div class="mb-3">
            <label for="id_password" class="form-label">Password</label>
            <input type="password" name="password" id="id_password" class="form-control" required>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary"><i class="bi bi-box-arrow-in-right"></i> Log in</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
